<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <title>Q2 Drill 1</title>
<style>
    body{
        background-image: url(https://i.pinimg.com/736x/25/06/42/25064259b1e99afb42bcd73f54b47d6b.jpg);
        background-size: cover;
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    h2{
        font-weight: 700;
    }
    h2, .col-3{
        background-color:rgb(150, 100, 171);
        border-radius: 15px;
        padding: 5px;
        box-shadow: 5px 5px 10px 1px #000000;
    }
    h5{
        background-color:#c5a4e4;
        border-radius: 5px;
        padding: 3px;
    }
    img{
        width:300px;
        height: 300px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
</style>
</head>
<body>
    <div class="container pt-5">
        <h2 class="text-center">Beginner's Guide to Volleyball</h2>
        <br><br>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQt0996GXX9pW8G9yDf1kNHfnQ8WT59psJvTclJzscmVw&s=10">
    </div>

    <div class= "container pt-5">
        <div class="row gap-4 justify-content-center">
            <div class="col-3 p-3 border rounded bg-white vh-50">
                <h5>Basic Rules</h5>
                <ul>
                    <li>Service before the line</li>
                    <li>Rotation of players</li>
                    <li>No net touch</li>
                    <li>No ball bounce</li>
                </ul>
    </div>

    <div class="col-3 p-3 border rounded bg-white vh-50">
        <h5>Basic Techniques</h5>
        <ul>
            <li>Spiking</li>
            <li>Setting</li>
            <li>Blocking</li>
            <li>Passing</li>
        </ul>
    </div>

    <div class= "col-3 p-3 border rounded bg-white vh-50">
        <h5>Volleyball Equipment</h5>
        <ul>
        <li>Ball</li>
        <li>Net</li>
        <li>Post</li>
        <li>Court</li>
        </ul>
    </div>

</html>
